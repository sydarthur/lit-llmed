# GCP Configuration for lit-llmed
gcp:
  project_id: ${GCP_PROJECT_ID}  # Set via environment variable
  region: us-central1
  
  # Google Cloud Storage configuration
  storage:
    bucket_name: ${GCS_BUCKET_NAME}  # Set via environment variable
    folders:
      data: "data"           # Raw JSON files
      exports: "exports"     # CSV/RIS exports
      logs: "logs"          # Processing logs
      cache: "cache"        # Temporary cache
  
  # Cloud Run service configuration  
  service:
    name: lit-llmed-gcp
    memory: 1Gi
    cpu: 1
    max_instances: 10
    timeout: 900  # 15 minutes for long fetches

# Literature fetching configuration
fetcher:
  email: ${FETCHER_EMAIL}  # Set via environment variable  
  rate_limit_delay: 1.0
  max_workers: 3
  
  # Default fetch parameters
  defaults:
    days_back: 30
    max_articles_per_fetch: 50
    include_abstracts: true
    include_open_access: true